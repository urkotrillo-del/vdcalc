[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vdcalc"
version = "0.1.0"
description = "Vehicle dynamics calculator: dynamic results (0-100, braking, lap time) from user-supplied vehicle data"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
